name: Update Tech Blog Feed

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'app.js'
      - 'styles.css'
      - '.github/workflows/update.yml'
  pull_request:
    branches: [main]
    paths:
      - 'build.py'
      - 'app.js'
      - 'styles.css'
      - '.github/workflows/update.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: python -m py_compile build.py

      - name: Run build script
        run: python build.py

      - name: Commit generated feed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Update feed [skip ci]" && git push)
